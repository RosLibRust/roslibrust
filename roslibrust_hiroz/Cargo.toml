[package]
name = "roslibrust_hiroz"
version = "0.23.0"
edition = "2021"
authors = ["carter <carterjschultz@gmail.com>"]
license = "MIT"
readme = "README.md"
description = "A native ROS 2 backend for roslibrust built on hiroz and rmw_zenoh."
repository = "https://github.com/roslibrust/roslibrust"
keywords = ["ROS", "ROS2", "robotics", "zenoh"]
categories = ["science::robotics"]

[dependencies]
zenoh = "1.7"
zenoh-buffers = "1.7"
tokio = { workspace = true }
env_logger = "0.11"
cdr = "0.2"
hiroz-cdr = "0.1.0"
roslibrust_common = { path = "../roslibrust_common", version = "0.22" }
anyhow = "1.0"
hiroz = { version = "0.1.0", default-features = false, features = ["kilted", "rmw-zenoh"] }
log = "0.4"
# Used for cancellation token
tokio-util = "0.7"
# Needed for the serde wrapper around roslibrust message types.
serde = { workspace = true }

[dev-dependencies]
roslibrust_test = { path = "../roslibrust_test" }

[features]
# Used to enable tests that rely on a locally running ros2 rmw_zenohd
hiroz_test = []

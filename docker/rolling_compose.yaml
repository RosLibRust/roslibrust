services:
  rosbridge_rolling:
    image: carter12s/roslibrust-ci-rolling:rust_1_94
    # ports:
    #   - "9090:9090"
    network_mode: host # For developing ros2 backend
    # command: bash -c "source /opt/ros/rolling/setup.bash; ros2 run rmw_zenoh_cpp rmw_zenohd & disown; ros2 launch rosbridge_server rosbridge_websocket_launch.xml & disown; ros2 run rosapi rosapi_node --ros-args --log-level debug"
    # Version without rosbridge for zenoh testing
    command: bash -c "source /opt/ros/rolling/setup.bash; ros2 run rmw_zenoh_cpp rmw_zenohd"
    volumes:
      # Mounting in the repo for internal development, and devcontainer access
      - ../:/roslibrust
      # Mount a sibling hiroz repo so it can also be tested within the docker image
      - ../../hiroz:/hiroz

[package]
name = "roslibrust_test"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
env_logger = "0.10"
roslibrust = { path = "../roslibrust", features = ["ros1", "codegen", "macro", "mock"] }
lazy_static = "1.5"
tokio = { workspace = true }
log = { workspace = true }
zenoh = "1.7"

[dev-dependencies]
diffy = "0.3.0"
criterion = { version = "0.5", features = ["html_reports", "async_tokio"] }
pprof = { version = "0.15", features = ["flamegraph", "criterion"] }
test-log = { workspace = true }
hex = "0.4"
roslibrust_zenoh = { path = "../roslibrust_zenoh" }
roslibrust_hiroz = { path = "../roslibrust_hiroz" }
roslibrust_rosbridge = { path = "../roslibrust_rosbridge" }
hiroz = { version = "0.1.0", default-features = false, features = ["kilted", "rmw-zenoh"] }

[[bin]]
path = "src/performance_ramp.rs"
name = "ramp"

[[bench]]
name = "image_bench"
harness = false

[features]
ros1_test = []
hiroz_test = []
rosbridge_ros1_test = []
rosbridge_ros2_test = []
